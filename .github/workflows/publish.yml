name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package only, do not publish"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Verify package.json version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION"
          echo "release tag : $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - name: Integration tests, VS Code Web
        run: npm run test:integration

      # Linux has no display, so running desktop VS Code needs xvfb.
      - name: Integration tests, desktop VS Code
        run: xvfb-run -a npm run test:integration:desktop

      # Version from package.json, on release the check above matches it to the tag.
      - name: Package VSIX
        run: |
          VSIX_NAME="microbit-micropython-$(node -p "require('./package.json').version").vsix"
          npx --yes @vscode/vsce package --out "$VSIX_NAME"
          echo "VSIX_NAME=$VSIX_NAME" >> "$GITHUB_ENV"

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: microbit-micropython-vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Upload VSIX to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$VSIX_NAME" --clobber

      # `github.event.inputs` is always a string, where `inputs` is typed from the
      # UI and a string over the API. Comparing strings behaves the same either way.
      - name: Publish to VS Code Marketplace
        if: github.event_name == 'release' || github.event.inputs.dry_run == 'false'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath "$VSIX_NAME"

      - name: Publish to Open VSX Registry
        if: github.event_name == 'release' || github.event.inputs.dry_run == 'false'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish --packagePath "$VSIX_NAME"
