name: Build and Test

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Linux has no display, so running desktop VS Code needs xvfb.
          - os: ubuntu-latest
            xvfb: xvfb-run -a
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      # This extension depends on the BBC micro:bit Manager. Its types package
      # is a file: dependency on a sibling checkout until it is published, and
      # the integration runs load the manager itself from the same checkout.
      - name: Check out and build the micro:bit Manager beside this repository
        run: |
          git clone --depth 1 https://github.com/carlosperate/vscode-microbit-manager.git ../vscode-microbit-manager
          cd ../vscode-microbit-manager && npm ci && npm run build

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - name: Integration tests, VS Code Web
        run: npm run test:integration

      - name: Integration tests, desktop VS Code
        run: ${{ matrix.xvfb }} npm run test:integration:desktop
