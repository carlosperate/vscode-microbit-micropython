name: Build and Test

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Linux has no display, so running desktop VS Code needs xvfb.
          - os: ubuntu-latest
            xvfb: xvfb-run -a
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - name: Integration tests, VS Code Web
        run: npm run test:integration

      - name: Integration tests, desktop VS Code
        run: ${{ matrix.xvfb }} npm run test:integration:desktop
